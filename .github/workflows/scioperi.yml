name: Aggiorna scioperi

on:
  schedule:
    - cron: "17 5,11,17 * * *"   # tre volte al giorno (orario UTC)
  workflow_dispatch:              # avvio manuale dal tab Actions

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Genera scioperi.ics
        run: python scripts/genera_ics.py

      - name: Commit se il file è cambiato
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scioperi.ics
          if git diff --cached --quiet; then
            echo "Nessuna modifica"
          else
            git commit -m "Aggiorna scioperi $(date -u +%F)"
            git push
          fi
